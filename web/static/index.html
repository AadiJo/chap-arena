<!DOCTYPE html>
<!--
Single-page UI for assigning teams to driver stations and editing network settings. Talks to the JSON API in web.go.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheesy Arena Radio Config</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 8px 12px; border-bottom: 1px solid #222; flex-wrap: wrap; }
  .bar b { font-weight: 600; }
  .bar a { color: #fff; text-decoration: none; opacity: .6; }
  .bar a.on { opacity: 1; }
  .sp { flex: 1; }
  .ok { color: #3fb950; } .bad { color: #f85149; } .warn { color: #d29922; } .dim { color: #888; }
  .red { color: #ff6b6b; } .blue { color: #6ea8ff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
  th { font-weight: 500; color: #aaa; font-size: 12px; }
  input, select, textarea { background: #000; color: #fff; border: 1px solid #444; padding: 5px 8px; font: inherit; width: 100%; }
  textarea { font: 12px/1.4 ui-monospace, Consolas, monospace; }
  input.num { width: 90px; }
  input.dirty { border-color: #d29922; }
  input[type=checkbox] { width: auto; justify-self: start; }
  button { background: #fff; color: #000; border: 0; padding: 7px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: #000; color: #fff; border: 1px solid #444; font-weight: 400; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
  .log { font: 12px/1.5 ui-monospace, Consolas, monospace; padding: 8px 12px; color: #bbb; border-top: 1px solid #222;
    height: 240px; overflow: auto; white-space: pre-wrap; margin: 0; }
  .scroll { overflow-x: auto; }
  .form { display: grid; grid-template-columns: 180px 1fr; gap: 8px 12px; padding: 12px; max-width: 640px; }
  .form label { color: #ccc; align-self: center; }
  fieldset { border: 0; border-top: 1px solid #222; margin: 0; padding: 12px 0 0; }
  legend { font-weight: 600; padding: 0 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) { .form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <b>Radio Config</b>
    <a href="#" id="nav-stations">Stations</a>
    <a href="#settings" id="nav-settings">Settings</a>
    <span class="sp"></span>
    <span>AP <span id="ap-status" class="dim">-</span></span>
    <span>Switch <span id="switch-status" class="dim">-</span> <span id="last-applied" class="dim"></span></span>
  </div>

  <section id="stations-view">
    <div class="scroll">
      <table>
        <thead>
          <tr><th>Station</th><th>Team</th><th>Password</th><th>Radio</th><th>SNR</th><th>Rx / Tx Mbps</th><th>Quality</th></tr>
        </thead>
        <tbody id="stations"></tbody>
      </table>
    </div>
    <div class="row">
      <button id="apply">Apply</button>
      <button class="ghost" id="clear">Clear all</button>
      <span id="apply-message"></span>
    </div>
    <pre class="log" id="log"></pre>
  </section>

  <section id="settings-view" hidden>
    <fieldset><legend>Access point</legend>
      <div class="form">
        <label for="ApAddress">Address</label><input id="ApAddress" placeholder="10.0.100.2">
        <label for="ApPassword">API password</label><input id="ApPassword" type="password">
        <label for="ApChannel">Channel (6 GHz)</label><select id="ApChannel"></select>
      </div>
    </fieldset>
    <fieldset><legend>Switch</legend>
      <div class="form">
        <label for="SwitchAddress">Address</label><input id="SwitchAddress" placeholder="10.0.100.3">
        <label for="SwitchPassword">Password</label><input id="SwitchPassword" type="password">
      </div>
    </fieldset>
    <fieldset><legend>SCC switches</legend>
      <div class="form">
        <label for="SCCManagementEnabled">Enabled</label><input id="SCCManagementEnabled" type="checkbox">
        <label for="RedSCCAddress">Red address</label><input id="RedSCCAddress" placeholder="10.0.100.48">
        <label for="BlueSCCAddress">Blue address</label><input id="BlueSCCAddress" placeholder="10.0.100.49">
        <label for="SCCUsername">Username</label><input id="SCCUsername" placeholder="admin">
        <label for="SCCPassword">Password</label><input id="SCCPassword" type="password">
        <label for="SCCUpCommands">Enable commands</label><textarea id="SCCUpCommands" rows="7"></textarea>
        <label for="SCCDownCommands">Disable commands</label><textarea id="SCCDownCommands" rows="7"></textarea>
      </div>
    </fieldset>
    <div class="row"><button id="save-settings">Save</button><span id="settings-message"></span></div>
  </section>
</main>

<script>
"use strict";

const stationNames = ["R1", "R2", "R3", "B1", "B2", "B3"];
const qualityNames = ["-", "caution", "warning", "good", "excellent"];
const qualityClasses = ["dim", "bad", "warn", "ok", "ok"];
const settingsFields = [
  "ApAddress", "ApPassword", "ApChannel", "SwitchAddress", "SwitchPassword", "SCCManagementEnabled",
  "RedSCCAddress", "BlueSCCAddress", "SCCUsername", "SCCPassword", "SCCUpCommands", "SCCDownCommands",
];
const $ = (id) => document.getElementById(id);

// Last status from the server; its assignments are what the inputs are compared against for dirty state.
let lastStatus = null;
const rows = [];

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body === undefined ? {} : { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const json = await response.json();
  if (!response.ok) throw new Error(json.error ?? response.statusText);
  return json;
}

function setText(element, text, className) {
  element.textContent = text;
  element.className = className ?? "";
}

function buildStationRows() {
  const tbody = $("stations");
  stationNames.forEach((name, i) => {
    const tr = document.createElement("tr");
    const cell = () => tr.appendChild(document.createElement("td"));
    setText(cell(), name, name.startsWith("R") ? "red" : "blue");
    const team = cell().appendChild(document.createElement("input"));
    team.className = "num";
    team.inputMode = "numeric";
    const wpaKey = cell().appendChild(document.createElement("input"));
    wpaKey.placeholder = "empty";
    wpaKey.spellcheck = false;
    const row = { team, wpaKey, radio: cell(), snr: cell(), rates: cell(), quality: cell() };
    rows.push(row);
    tbody.appendChild(tr);

    team.addEventListener("input", () => renderRow(i));
    wpaKey.addEventListener("input", () => renderRow(i));
    team.addEventListener("change", () => prefillWpaKey(i));
    // Enter applies; from the team field it waits for the password prefill first.
    team.addEventListener("keydown", async (event) => {
      if (event.key !== "Enter") return;
      await prefillWpaKey(i);
      apply();
    });
    wpaKey.addEventListener("keydown", (event) => { if (event.key === "Enter") apply(); });
  });
}

// Fills the password from event.db when a team number is entered, if that team has one stored.
async function prefillWpaKey(i) {
  const teamId = Number(rows[i].team.value);
  if (!teamId) return;
  try {
    const team = await api("GET", `/api/teams/${teamId}`);
    if (Number(rows[i].team.value) === teamId && team.wpaKey) rows[i].wpaKey.value = team.wpaKey;
  } catch {
    // Team isn't in the database yet; the typed password will be saved on apply.
  }
  renderRow(i);
}

function inputAssignment(i) {
  const teamId = Number(rows[i].team.value.trim()) || 0;
  return { teamId, wpaKey: teamId ? rows[i].wpaKey.value : "" };
}

function isDirty(i) {
  const applied = lastStatus?.stations[i].assignment ?? { teamId: 0, wpaKey: "" };
  const current = inputAssignment(i);
  return current.teamId !== applied.teamId || current.wpaKey !== applied.wpaKey;
}

function loadInputsFromStatus() {
  lastStatus.stations.forEach((station, i) => {
    rows[i].team.value = station.assignment.teamId || "";
    rows[i].wpaKey.value = station.assignment.wpaKey;
  });
}

function renderRow(i) {
  const row = rows[i];
  const station = lastStatus?.stations[i];
  const dirty = isDirty(i);
  row.team.classList.toggle("dirty", dirty);
  row.wpaKey.classList.toggle("dirty", dirty);

  const assignment = station?.assignment ?? { teamId: 0 };
  const wifi = station?.wifi;
  const blank = () => {
    for (const element of [row.snr, row.rates, row.quality]) setText(element, "-", "dim");
  };
  if (dirty) {
    setText(row.radio, "not applied", "dim");
    blank();
  } else if (!assignment.teamId) {
    setText(row.radio, "-", "dim");
    blank();
  } else if (!wifi || wifi.TeamId !== assignment.teamId) {
    setText(row.radio, "configuring", "warn");
    blank();
  } else if (!wifi.RadioLinked) {
    setText(row.radio, "no link", "bad");
    blank();
  } else {
    setText(row.radio, "linked", "ok");
    setText(row.snr, String(wifi.SignalNoiseRatio), wifi.SignalNoiseRatio < 25 ? "warn" : "");
    setText(row.rates, `${wifi.RxRate.toFixed(0)} / ${wifi.TxRate.toFixed(0)}`);
    const quality = wifi.ConnectionQuality;
    setText(row.quality, qualityNames[quality] ?? "-", qualityClasses[quality] ?? "dim");
  }
}

function hardwareClass(status) {
  if (status === "ACTIVE") return "ok";
  if (status === "ERROR") return "bad";
  if (status === "CONFIGURING") return "warn";
  return "dim";
}

function renderStatus() {
  setText($("ap-status"), lastStatus.accessPointStatus, hardwareClass(lastStatus.accessPointStatus));
  setText($("switch-status"), lastStatus.switchStatus, hardwareClass(lastStatus.switchStatus));
  const applied = new Date(lastStatus.lastApplied);
  setText($("last-applied"), applied.getFullYear() > 1 ? `applied ${applied.toLocaleTimeString()}` : "", "dim");
  rows.forEach((_, i) => renderRow(i));

  const dirtyCount = rows.filter((_, i) => isDirty(i)).length;
  const message = $("apply-message");
  if (!message.dataset.sticky) {
    setText(message, dirtyCount ? `${dirtyCount} unapplied change${dirtyCount === 1 ? "" : "s"}` : "", "warn");
  }

  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  const text = lastStatus.log.join("\n");
  if (log.textContent !== text) {
    log.textContent = text;
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
}

function showApplyMessage(text, className) {
  const message = $("apply-message");
  setText(message, text, className);
  message.dataset.sticky = "1";
  setTimeout(() => delete message.dataset.sticky, 4000);
}

async function apply() {
  const button = $("apply");
  button.disabled = true;
  try {
    const assignments = stationNames.map((_, i) => inputAssignment(i));
    lastStatus = await api("PUT", "/api/stations", assignments);
    loadInputsFromStatus();
    showApplyMessage("Applied", "ok");
  } catch (error) {
    showApplyMessage(error.message, "bad");
    lastStatus = await api("GET", "/api/status").catch(() => lastStatus);
  } finally {
    button.disabled = false;
    if (lastStatus) renderStatus();
  }
}

async function poll() {
  try {
    const first = lastStatus === null;
    lastStatus = await api("GET", "/api/status");
    if (first) loadInputsFromStatus();
    renderStatus();
  } catch (error) {
    setText($("ap-status"), "app unreachable", "bad");
  } finally {
    setTimeout(poll, 1000);
  }
}

// Settings view.

function buildChannelOptions(current) {
  const select = $("ApChannel");
  select.replaceChildren();
  const channels = Array.from({ length: 29 }, (_, i) => 5 + i * 8);
  if (!channels.includes(current)) channels.unshift(current);
  for (const channel of channels) select.add(new Option(String(channel), String(channel)));
  select.value = String(current);
}

async function loadSettings() {
  const settings = await api("GET", "/api/settings");
  buildChannelOptions(settings.ApChannel);
  for (const field of settingsFields) {
    const input = $(field);
    if (input.type === "checkbox") input.checked = settings[field];
    else if (field !== "ApChannel") input.value = settings[field];
  }
}

async function saveSettings() {
  const settings = {};
  for (const field of settingsFields) {
    const input = $(field);
    settings[field] = input.type === "checkbox" ? input.checked : field === "ApChannel" ? Number(input.value) : input.value;
  }
  try {
    await api("PUT", "/api/settings", settings);
    setText($("settings-message"), "Saved", "ok");
  } catch (error) {
    setText($("settings-message"), error.message, "bad");
  }
}

function route() {
  const onSettings = location.hash === "#settings";
  $("stations-view").hidden = onSettings;
  $("settings-view").hidden = !onSettings;
  $("nav-stations").classList.toggle("on", !onSettings);
  $("nav-settings").classList.toggle("on", onSettings);
  if (onSettings) {
    setText($("settings-message"), "");
    loadSettings().catch((error) => setText($("settings-message"), error.message, "bad"));
  }
}

buildStationRows();
$("apply").addEventListener("click", apply);
$("clear").addEventListener("click", () => {
  for (const row of rows) row.team.value = row.wpaKey.value = "";
  if (lastStatus) renderStatus();
});
$("save-settings").addEventListener("click", saveSettings);
window.addEventListener("hashchange", route);
route();
poll();
</script>
</body>
</html>
