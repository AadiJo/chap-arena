<!DOCTYPE html>
<!--
The team page that driver stations reach on the team port (served by team.go). Setup is the computer's own station in
the alliance's color, styled like a row of the admin Stations view: team number, radio password (the station's current one, filled in),
radio link and NT status, and Apply. Under it is the topic tree from the admin Teams view, for this team only. Downloads lists every
recording session, newest first and open, with the team's own file marked in the color of the alliance it played on in
that session. Dark only. The palette and the styles it
shares with the admin UI are copied from static/index.html; the tree's are in /topic-tree.css. Logic lives in
/team.js (see its header for the markup contract), /topics.js and /topic-tree.js; /demo.js fakes the API when the URL
has ?demo (?demo=B2 to stand in B2).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMS</title>
<link rel="icon" href="/favicon.png">
<script src="/topics.js"></script>
<script src="/demo.js"></script>
<script src="/helpers.js" defer></script>
<script src="/topic-tree.js" defer></script>
<script src="/team.js" defer></script>
<style>
  :root {
    --bg: #000; --panel: #0b0b0b; --fg: #fff; --fg2: #a3a3a3; --fg3: #5e5e5e; --line: #1c1c1c; --line2: #2e2e2e; --fill: #161616;
    --red: #ff4d5e; --blue: #4d8dff;
    --ok: #3ddc84; --warn: #ffb020; --bad: #ff4d5e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  /* The station's alliance color (body[data-alliance] is set by team.js). */
  body[data-alliance=red] { --alliance: var(--red); }
  body[data-alliance=blue] { --alliance: var(--blue); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "SF Pro Text", -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; min-height: 100vh; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  [data-state=ok] { color: var(--ok); } [data-state=warn] { color: var(--warn); } [data-state=bad] { color: var(--bad); } [data-state=dim] { color: var(--fg3); }

  /* Equal side columns keep the tab switch centered on the page no matter how wide the title or status get. */
  body > header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 28px; padding: 12px 28px; }
  .brand { font-size: 14px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  #reach { justify-self: end; font-size: 13px; font-weight: 500; }

  /* Two equal tabs over a pill that slides to the current view (body[data-view] is set by team.js). */
  nav { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); padding: 3px; border-radius: 9px; position: relative; isolation: isolate; }
  nav::before { content: ""; position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 2); border-radius: 6px; background: var(--panel); transition: transform .25s cubic-bezier(.3, .7, .2, 1); }
  body[data-view=downloads] nav::before { transform: translateX(100%); }
  /* 4px/6px instead of 5px/5px: the box centers cap height, but the eye centers the lowercase letters, which sit low. */
  nav a { color: var(--fg2); text-decoration: none; padding: 4px 20px 6px; text-align: center; font-weight: 500; font-size: 13px; transition: color .2s; }
  nav a[aria-current] { color: var(--fg); }

  /* The incoming view slides in from the side its tab is on (body[data-enter] is set by team.js). One-shot, so nothing
     repaints while idle. */
  body[data-enter=left] .view:not([hidden]) { animation: from-left .28s cubic-bezier(.3, .7, .2, 1); }
  body[data-enter=right] .view:not([hidden]) { animation: from-right .28s cubic-bezier(.3, .7, .2, 1); }
  @keyframes from-left { from { opacity: 0; transform: translateX(-24px); } }
  @keyframes from-right { from { opacity: 0; transform: translateX(24px); } }
  @media (prefers-reduced-motion: reduce) { nav::before, .view { transition: none; animation: none !important; } }

  main { flex: 1; width: 100%; padding: 0 28px 60px; max-width: 1280px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

  /* Setup: the station row from the admin Stations view under the alliance banner, with Apply at its end, then the
     topic tree. */
  .banner { height: 38px; background: var(--alliance); }
  .station { display: grid; grid-template-columns: 56px 1fr auto auto; grid-template-rows: auto auto; column-gap: 24px; padding: 16px 20px; align-items: center; }
  .station .name { grid-row: 1 / 3; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--alliance); }
  .station input[data-field=team] { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; padding: 2px 6px; margin-left: -7px; width: 150px; }
  .station input[data-field=wpaKey] { font: 12px var(--mono); color: var(--fg2); padding: 3px 6px; margin-left: -7px; width: 220px; }
  .station[data-dirty=true] { background: linear-gradient(90deg, color-mix(in srgb, var(--warn) 9%, transparent), transparent 60%); }
  input.dirty { color: var(--warn) !important; }
  .link { grid-row: 1 / 3; grid-column: 3; display: grid; justify-items: end; gap: 6px; text-align: right; }
  .radio { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--fg2); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .bars i { width: 4px; border-radius: 1px; background: var(--line2); }
  .bars i:nth-child(1) { height: 25%; } .bars i:nth-child(2) { height: 50%; } .bars i:nth-child(3) { height: 75%; } .bars i:nth-child(4) { height: 100%; }
  [data-quality="1"] .bars i:nth-child(-n+1) { background: var(--bad); }
  [data-quality="2"] .bars i:nth-child(-n+2) { background: var(--warn); }
  [data-quality="3"] .bars i:nth-child(-n+3), [data-quality="4"] .bars i { background: var(--ok); }
  [data-field=nt] { font-size: 12px; }
  .station #apply { grid-row: 1 / 3; grid-column: 4; }
  #apply-message { display: block; padding: 0 20px 14px 96px; margin-top: -6px; font-size: 13px; font-weight: 500; }
  #apply-message:empty { display: none; }
  .topics { padding: 0 22px 22px; border-top: 1px solid var(--line); }
  .topics .topic-tools { margin-top: 18px; }
  #teams-message { display: block; margin-top: 10px; font-weight: 500; }
  #no-station { padding: 22px 24px; }
  #no-station h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  #no-station p { margin: 0; color: var(--fg2); }

  input { font: inherit; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 6px; outline: none; }
  input::placeholder { color: var(--fg3); }
  .station input:hover { background: var(--bg); }
  input:focus { background: var(--bg); border-color: var(--line2); }
  button { font: inherit; font-weight: 600; font-size: 14px; height: 40px; padding: 0 22px; border-radius: 10px; border: 0; cursor: pointer; background: var(--line); color: var(--fg); }
  button.primary { background: var(--fg); color: var(--bg); }
  body[data-dirty=true] #apply { background: var(--warn); color: #000; }
  button:disabled { opacity: .5; cursor: default; }
  button svg { width: 16px; height: 16px; display: block; }

  /* Downloads: the sessions list from the old logs page, in the same 760px column. A session opens in place to show its
     files. The team's own file gets a bar in the color of the alliance it was on in that session (data-alliance on the
     file, set by team.js), or white for a session from before stations were noted. */
  .downloads { max-width: 760px; margin: 0 auto; }
  .downloads svg { width: 16px; height: 16px; display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .lrow { display: grid; align-items: center; gap: 14px; width: 100%; height: auto; padding: 9px 16px; min-height: 52px; position: relative; border-radius: 0; background: transparent; color: inherit; font-weight: 400; text-align: left; text-decoration: none; }
  .lrow:hover { background: var(--fill); }
  .lrow:focus-visible { outline: 2px solid var(--fg2); outline-offset: -2px; }
  .group + .group > .session::before, .files .file + .file::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  .lrow small { display: block; margin-top: 1px; font-size: 12px; color: var(--fg3); }
  .lrow > svg { color: var(--fg3); }
  .session { grid-template-columns: 18px 1fr 16px; }
  .session > svg:last-child { transition: transform .12s; }
  .group[data-open=true] > .session { background: var(--fill); }
  .group[data-open=true] > .session > svg:last-child { transform: rotate(90deg); }
  .group:not([data-open=true]) > .files { display: none; }
  /* The name and size sit on one baseline, and the row centers that line beside the button. Centering each cell on its
     own would leave the small size 2px above the team number's baseline. */
  .file { grid-template-columns: 1fr 30px; padding-left: 50px; }
  .file .line { display: flex; align-items: baseline; gap: 14px; }
  .file .name { flex: 1; }
  .file b { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
  .file .ext { color: var(--fg3); font-family: var(--mono); }
  .file[data-mine] { box-shadow: inset 3px 0 0 var(--fg); }
  .file[data-mine][data-alliance=red] { box-shadow: inset 3px 0 0 var(--red); }
  .file[data-mine][data-alliance=blue] { box-shadow: inset 3px 0 0 var(--blue); }
  .meta { font-size: 12px; color: var(--fg2); white-space: nowrap; }
  .dl { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--line); }
  .lrow:hover .dl { background: var(--line2); }
  #sessions:empty::after, .files:empty::after { content: attr(data-empty); display: block; padding: 14px 16px; font-size: 13px; color: var(--fg3); }
  .files:empty::after { padding-left: 50px; }

  @media (max-width: 900px) {
    .station { grid-template-columns: 48px 1fr auto; }
    .station #apply { grid-row: 3; grid-column: 2 / 4; justify-self: start; margin-top: 12px; }
    #apply-message { padding-left: 20px; }
  }
</style>
<link rel="stylesheet" href="/topic-tree.css">
</head>
<body data-view="setup">
<!-- Icons: Lucide (lucide.dev, ISC license), inlined like the admin UI's so they work without internet. -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
</svg>
<header>
  <span class="brand">Field Management System</span>
  <nav><a href="#" data-nav="setup">Setup</a><a href="#downloads" data-nav="downloads">Downloads</a></nav>
  <span id="reach"></span>
</header>

<main>
  <section id="setup-view" class="view">
    <div class="panel" id="station-panel" hidden>
      <div class="banner"></div>
      <div class="station" id="station">
        <span class="name" data-field="name"></span>
        <input data-field="team" inputmode="numeric" placeholder="----" aria-label="Team number">
        <input data-field="wpaKey" spellcheck="false" autocomplete="off" aria-label="Radio password">
        <div class="link">
          <span class="radio"><span class="bars"><i></i><i></i><i></i><i></i></span><span data-field="radio"></span></span>
          <span data-field="nt"></span>
        </div>
        <button class="primary" id="apply">Apply</button>
      </div>
      <span id="apply-message"></span>
      <div class="topics">
        <div class="topic-tools">
          <label class="topic-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="topic-search" spellcheck="false" autocomplete="off" aria-label="Search topics or type a path">
            <kbd>/</kbd>
            <button type="button" id="topic-search-clear" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </label>
          <div class="topic-show" role="group" aria-label="Show"><button type="button" data-topic-view="all">All</button><button type="button" data-topic-view="recording">Recording <span id="recording-count"></span></button></div>
        </div>
        <div id="topic-hits" hidden><span id="topic-hits-count"></span><button type="button" class="add" id="add-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
        <div id="topic-tree" role="tree"></div>
        <p id="topic-note" hidden></p>
        <span id="teams-message"></span>
      </div>
    </div>
    <div class="panel" id="no-station" hidden>
      <h2 id="no-station-title"></h2>
      <p id="no-station-text"></p>
    </div>
    <template id="tree-row-template">
      <div class="trow" role="treeitem"><span class="nm"><svg class="tri" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 16.5 12 9 18.5z"/></svg><span data-field="name"></span></span><span data-field="count"></span><span data-field="type"></span><span data-field="hz"></span><span data-field="last"></span><span class="act"><button type="button" class="add" data-action="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button><button type="button" class="remove" data-action="remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button></span></div>
    </template>
  </section>

  <section id="downloads-view" class="view downloads" hidden>
    <div class="list" id="sessions"></div>
    <template id="session-template">
      <div class="group">
        <button type="button" class="lrow session"><svg aria-hidden="true"><use href="#folder"/></svg><span><span data-field="label"></span><small data-field="count"></small></span><svg aria-hidden="true"><use href="#right"/></svg></button>
        <div class="files"></div>
      </div>
    </template>
    <template id="file-template">
      <a class="lrow file" download>
        <span class="line"><span class="name"><b data-field="team"></b><span class="ext" data-field="ext"></span></span><span class="meta" data-field="size"></span></span>
        <span class="dl" aria-hidden="true"><svg><use href="#download"/></svg></span>
      </a>
    </template>
  </section>
</main>
</body>
</html>
