on: [ push, pull_request ]
name: Build/Test
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build
      - name: Test
        run: go test -race ./...
      - name: Check formatting
        run: test -z "$(go fmt ./...)"
      - name: Vet
        run: go vet ./...
