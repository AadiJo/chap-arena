on:
  push:
    tags:
      - "v*"
name: Create Release
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --title "Chap Arena $GITHUB_REF_NAME" --notes "Download the build for your operating system below. Unzip it and run the binary; it opens the web UI in your browser. The web UI is built into the binary, so it can be run from anywhere."

  bundle:
    needs: create
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: linux.x64 }
          - { goos: darwin, goarch: amd64, suffix: macos.x64 }
          - { goos: darwin, goarch: arm64, suffix: macos.m1 }
          - { goos: windows, goarch: amd64, suffix: windows.x64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir chap-arena
          go build -o "chap-arena/chap-arena${{ matrix.ext }}"
          cp LICENSE README.md switch_config.txt chap-arena/
          zip -r -X "chap-arena.${GITHUB_REF_NAME}.${{ matrix.suffix }}.zip" chap-arena

      - name: Upload bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "chap-arena.${GITHUB_REF_NAME}.${{ matrix.suffix }}.zip" --clobber
